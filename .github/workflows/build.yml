name: Xcode - Build

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project FlacTagZapper.xcodeproj \
            -scheme FlacTagZapper

      - name: Build
        run: |
          xcodebuild build \
            -project FlacTagZapper.xcodeproj \
            -scheme FlacTagZapper \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/FlacTagZapper.app"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r FlacTagZapper-unsigned.ipa Payload > /dev/null
          ls -la FlacTagZapper-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: FlacTagZapper-unsigned-ipa
          path: FlacTagZapper-unsigned.ipa
